<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storge</title>
<!-- ?v=2：/favicon.svg 带 max-age=86400 缓存，改 ico 后换版本号才能让浏览器重拉 -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="alternate icon" href="/favicon.svg?v=2">
<style>
  /* ========== shadcn/ui design tokens ========== */
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --primary: 240 5.9% 10%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;
    --accent-foreground: 240 5.9% 10%;
    --destructive: 0 84.2% 60.2%;
    --destructive-foreground: 0 0% 98%;
    --success: 142 71% 45%;
    --success-foreground: 0 0% 98%;
    --warning: 38 92% 50%;
    --warning-foreground: 0 0% 98%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 240 5.9% 10%;
    --radius: 0.5rem;
    --content-max: 1280px;
    --content-pad: 20px;
  }
  .dark {
    --background: 240 10% 3.9%;
    --foreground: 0 0% 98%;
    --card: 240 10% 5.9%;
    --card-foreground: 0 0% 98%;
    --primary: 0 0% 98%;
    --primary-foreground: 240 5.9% 10%;
    --secondary: 240 3.7% 15.9%;
    --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%;
    --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%;
    --accent-foreground: 0 0% 98%;
    --destructive: 0 62.8% 50.6%;
    --destructive-foreground: 0 0% 98%;
    --success: 142 69% 58%;
    --success-foreground: 0 0% 9%;
    --warning: 38 92% 60%;
    --warning-foreground: 0 0% 9%;
    --border: 240 3.7% 15.9%;
    --input: 240 3.7% 15.9%;
    --ring: 240 4.9% 83.9%;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    min-height: 100vh; font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column;
    transition: background-color .2s, color .2s;
  }

  /* ========== Navbar (shadcn) ========== */
  .nav {
    position: sticky; top: 0; z-index: 10;
    height: 56px;
    border-bottom: 1px solid hsl(var(--border));
    background: hsl(var(--background) / .95); backdrop-filter: blur(6px);
  }
  /* 内容区：限制最大宽度并水平居中，与导航品牌对齐 */
  .nav-inner,
  .files-toolbar,
  .table-card,
  .footer-inner {
    max-width: var(--content-max);
    width: 100%;
    margin-inline: auto;
    padding-left: var(--content-pad);
    padding-right: var(--content-pad);
    box-sizing: border-box;
  }
  /* 与下方内容同宽同边距，保证品牌与面包屑/按钮左对齐 */
  .nav-inner {
    height: 100%;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 600; letter-spacing: -0.025em;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-sub {
    font-size: 11px; font-weight: 400; letter-spacing: 0;
    color: hsl(var(--muted-foreground));
  }
  .nav-brand .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: calc(var(--radius) - 4px);
    background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  }
  /* Lucide icons（内联 SVG，currentColor 继承文字颜色） */
  .ic { width: 16px; height: 16px; flex: none; }
  .logo .ic { width: 14px; height: 14px; }
  .ic-sm { width: 14px; height: 14px; vertical-align: -2px; }
  .nav-links { display: flex; align-items: center; gap: 4px; }

  /* ========== Card (shadcn) ========== */
  .card {
    background: hsl(var(--card));
    color: hsl(var(--card-foreground));
    border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) + 4px);
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  }

  /* ========== Breadcrumbs (shadcn) ========== */
  .files-toolbar {
    padding-top: 20px;
    padding-bottom: 16px;
  }
  .toolbar-card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
    min-height: 52px;
    padding: 8px 12px 8px 16px;
  }
  .breadcrumbs {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px;
    color: hsl(var(--muted-foreground));
    min-width: 0; flex: 1; overflow-x: auto;
  }
  .crumb { cursor: pointer; border: none; background: none; padding: 0;
    font-family: inherit; font-size: 14px; color: hsl(var(--muted-foreground)); }
  .crumb:hover { color: hsl(var(--foreground)); text-decoration: underline; }
  .crumb-home { display: inline-flex; align-items: center; }
  .crumb-home svg { width: 15px; height: 15px; display: block; }
  .crumb-home:hover { text-decoration: none; }
  .crumb-sep { opacity: .5; user-select: none; }
  .crumb-current { color: hsl(var(--foreground)); font-weight: 500; }

  /* ========== Dialog（shadcn） ========== */
  .dialog-overlay {
    position: fixed; inset: 0; z-index: 40;
    background: hsl(var(--background) / .6);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .dialog-overlay.open { opacity: 1; pointer-events: auto; }
  .dialog {
    position: fixed; z-index: 50;
    top: 50%; left: 50%;
    transform: translate(-50%, -48%) scale(.96);
    width: min(640px, calc(100vw - 32px));
    max-height: min(85vh, 720px);
    display: flex; flex-direction: column;
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    box-shadow: 0 25px 50px -12px hsl(0 0% 0% / .25);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .dialog.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .dialog-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 20px 20px 0;
  }
  .dialog-title { font-size: 18px; font-weight: 600; }
  .dialog-desc { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 4px; }
  .dialog-close {
    border: none; background: none; cursor: pointer;
    width: 32px; height: 32px; border-radius: calc(var(--radius) - 2px);
    color: hsl(var(--muted-foreground)); font-size: 15px; line-height: 1;
    display: grid; place-items: center; flex: none;
    transition: background .15s, color .15s;
  }
  .dialog-close:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
  .dialog-body { padding: 16px 20px 20px; overflow-y: auto; }
  .dialog-sm { width: min(420px, calc(100vw - 32px)); max-height: none; }
  .dialog-md { width: min(520px, calc(100vw - 32px)); max-height: none; }
  .kv {
    display: grid; grid-template-columns: 88px 1fr;
    gap: 10px 12px; align-items: start;
  }
  .kv-k { color: hsl(var(--muted-foreground)); font-size: 13px; padding-top: 1px; }
  .kv-v { font-size: 13px; word-break: break-all; min-width: 0; }
  .kv-v .mono { font-size: 12px; color: hsl(var(--foreground)); line-height: 1.45; }
  .hash-row { display: flex; align-items: flex-start; gap: 8px; }
  .hash-row .btn { height: 28px; padding: 0 8px; font-size: 12px; flex: none; }
  .input {
    width: 100%;
    height: 36px; padding: 0 12px;
    font-family: inherit; font-size: 14px;
    color: hsl(var(--foreground));
    background: hsl(var(--background));
    border: 1px solid hsl(var(--input));
    border-radius: calc(var(--radius) - 2px);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: hsl(var(--muted-foreground) / .7); }
  .input:focus { border-color: hsl(var(--ring)); box-shadow: 0 0 0 2px hsl(var(--ring) / .2); }

  .head-actions { display: flex; gap: 8px; align-items: center; }

  /* 目录行：可点击进入 */
  .row-dir { cursor: pointer; }
  .row-dir:hover td { background: hsl(var(--accent) / .5); }
  .dir-icon, .file-icon { margin-right: 8px; vertical-align: -3px; }
  .card-title {
    font-size: 22px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.3;
  }
  .sub {
    color: hsl(var(--muted-foreground)); font-size: 14px;
    margin-top: 4px; margin-bottom: 24px;
  }

  /* ========== Button (shadcn variants) ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap; border-radius: calc(var(--radius) - 2px);
    font-size: 14px; font-weight: 500; cursor: pointer;
    height: 36px; padding: 0 16px;
    border: 1px solid transparent; outline: none;
    transition: background-color .15s, color .15s, border-color .15s;
    font-family: inherit;
  }
  .btn:disabled { opacity: .65; cursor: not-allowed; pointer-events: none; }
  /* 按钮加载态：禁用但不显灰（上传中保持醒目） */
  .btn.loading:disabled { opacity: 1; }
  .spin { animation: spin 1s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
  /* default (primary) */
  .btn-default { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
  .btn-default:hover { background: hsl(var(--primary) / .9); }
  /* outline */
  .btn-outline { border-color: hsl(var(--input)); background: hsl(var(--background)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
  .btn-outline:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  /* ghost */
  .btn-ghost { background: transparent; color: hsl(var(--foreground)); }
  .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .btn-icon { width: 36px; padding: 0; }

  /* ========== Drop zone ========== */
  .drop {
    border: 1px dashed hsl(var(--border)); border-radius: calc(var(--radius) + 2px);
    padding: 40px 20px; text-align: center;
    color: hsl(var(--muted-foreground)); cursor: pointer;
    transition: background-color .15s, border-color .15s;
  }
  .drop:hover, .drop.drag { background: hsl(var(--accent) / .5); }
  .drop .icon { width: 30px; height: 30px; margin-bottom: 8px; }

  .row { display: flex; gap: 12px; margin-top: 16px; }
  .row-spread { justify-content: space-between; align-items: center; }

  /* ========== File info / Progress ========== */
  .file-info { margin-top: 20px; display: none; }
  .file-name {
    font-size: 14px; font-weight: 500; word-break: break-all; margin-bottom: 2px;
  }
  .file-meta { color: hsl(var(--muted-foreground)); font-size: 13px; margin-bottom: 12px; }
  .bar {
    height: 10px; width: 100%; overflow: hidden;
    border-radius: 999px; background: hsl(var(--primary) / .15);
  }
  .bar > div {
    height: 100%; width: 0; border-radius: 999px;
    background: hsl(var(--primary)); transition: width .25s;
  }
  .stats {
    display: flex; justify-content: space-between; margin-top: 8px;
    color: hsl(var(--muted-foreground)); font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ========== Log (shadcn terminal style) ========== */
  .log-wrap { margin-top: 16px; }
  .log-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px; font-weight: 500;
    color: hsl(var(--muted-foreground));
  }
  .log-head .btn { height: 24px; padding: 0 10px; font-size: 12px; }
  /* 可见性由外层 #log-wrap 控制（首条日志出现时 JS 设为 block） */
  .log {
    max-height: 140px; overflow-y: auto;
    background: hsl(var(--muted) / .4);
    border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) - 2px);
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: hsl(var(--muted-foreground));
    line-height: 1.7;
  }
  .log .ok  { color: hsl(var(--success)); }
  .log .err { color: hsl(var(--destructive)); }
  .log .info{ color: hsl(var(--foreground) / .8); }

  /* ========== Badge (shadcn variants) ========== */
  .badge {
    display: inline-flex; align-items: center;
    border-radius: calc(var(--radius) - 4px);
    padding: 2px 10px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent; margin-left: 8px; vertical-align: 2px;
    transition: background-color .15s, color .15s;
  }
  /* default: bg-primary */
  .badge { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  /* secondary */
  .badge.resume { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); }

  /* ========== Files table (shadcn) ========== */
  .files-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-card { flex: 1; padding-bottom: 24px; }
  .table-wrap { overflow: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th {
    text-align: left; font-weight: 500;
    color: hsl(var(--muted-foreground));
    height: 40px; padding: 0 16px;
    border-bottom: 1px solid hsl(var(--border));
    background: hsl(var(--muted) / .4);
  }
  .table td {
    padding: 10px 16px; vertical-align: middle;
    border-bottom: 1px solid hsl(var(--border) / .5);
  }
  .table tr:last-child td { border-bottom: none; }
  .table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table .ctr { text-align: center; }
  .table .idx {
    color: hsl(var(--muted-foreground));
    font-variant-numeric: tabular-nums;
    width: 48px; user-select: none;
  }
  .act-cell { text-align: right; white-space: nowrap; }
  .act { height: 28px; padding: 0 10px; font-size: 12px; }
  .act .ic { width: 14px; height: 14px; }

  /* ========== Dropdown Menu (shadcn 风格) ========== */
  .menu {
    position: fixed; z-index: 60; min-width: 140px; padding: 4px;
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) - 2px);
    box-shadow: 0 4px 6px -1px hsl(0 0% 0% / .1), 0 2px 4px -2px hsl(0 0% 0% / .1);
  }
  .menu-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 8px; border: none; background: none;
    border-radius: calc(var(--radius) - 4px);
    font-size: 13px; color: hsl(var(--foreground));
    cursor: pointer; text-align: left;
  }
  .menu-item:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .menu-item .ic { width: 14px; height: 14px; flex: none; }
  .menu-item.danger { color: hsl(var(--destructive)); }
  .menu-item.danger:hover { background: hsl(var(--destructive) / .1); color: hsl(var(--destructive)); }
  .menu-sep { height: 1px; margin: 4px 0; background: hsl(var(--border)); }
  .fname { font-weight: 500; word-break: break-all; min-width: 220px; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: hsl(var(--muted-foreground));
  }
  .empty { text-align: center; color: hsl(var(--muted-foreground)); }
  #files-empty { padding: 48px 16px; }
  .empty .icon { display: block; width: 28px; height: 28px; margin: 0 auto 8px; opacity: .5; }

  /* badge: destructive */
  .badge.destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }

  /* ========== 多文件上传队列（每项一个独立进度） ========== */
  .qitems {
    margin-top: 16px; display: flex; flex-direction: column; gap: 8px;
    max-height: 260px; overflow-y: auto;
  }
  .qitems:empty { display: none; }
  .qitem {
    border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) - 2px);
    padding: 10px 12px;
    background: hsl(var(--muted) / .25);
  }
  .qitem.done { border-color: hsl(var(--success) / .5); }
  .qitem.err  { border-color: hsl(var(--destructive) / .5); }
  .qtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .qname { font-size: 13px; font-weight: 500; word-break: break-all; }
  .qcancel {
    border: none; background: none; cursor: pointer; flex: none;
    width: 22px; height: 22px; border-radius: 4px;
    display: grid; place-items: center;
    color: hsl(var(--muted-foreground));
  }
  .qcancel:hover { background: hsl(var(--accent)); color: hsl(var(--destructive)); }
  .qmeta {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: hsl(var(--muted-foreground));
    margin: 3px 0 8px; font-variant-numeric: tabular-nums;
  }
  .qbar { height: 8px; }

  /* ========== Disk usage（工具栏容量条 + 上传弹窗余量预估） ========== */
  .disk {
    display: flex; align-items: center; gap: 8px;
    flex: none; min-width: 0;
  }
  /* [hidden] 的 UA 样式会被 display:flex 盖掉，必须显式处理 */
  .disk[hidden] { display: none; }
  .disk-bar {
    width: 96px; height: 6px; overflow: hidden;
    border-radius: 999px; background: hsl(var(--muted));
  }
  .disk-bar > div {
    height: 100%; width: 0; border-radius: 999px;
    background: hsl(var(--primary)); transition: width .3s;
  }
  .disk-text {
    font-size: 12px; color: hsl(var(--muted-foreground));
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .disk.warn .disk-bar > div { background: hsl(var(--warning)); }
  .disk.warn .disk-text { color: hsl(var(--warning)); }
  .disk.danger .disk-bar > div { background: hsl(var(--destructive)); }
  .disk.danger .disk-text { color: hsl(var(--destructive)); }
  .disk-est {
    margin-top: 8px; font-size: 12px;
    color: hsl(var(--muted-foreground));
    font-variant-numeric: tabular-nums;
  }
  .disk-est[hidden] { display: none; }
  .disk-est.warn { color: hsl(var(--warning)); }
  .disk-est.danger { color: hsl(var(--destructive)); }

  /* ========== Footer ========== */
  .footer {
    margin-top: auto;
    border-top: 1px solid hsl(var(--border));
    background: hsl(var(--background));
  }
  .footer-inner {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    min-height: 56px;
    padding-top: 12px; padding-bottom: 12px;
    font-size: 12px;
    color: hsl(var(--muted-foreground));
  }
  .footer a { color: inherit; text-decoration: none; }
  .footer a:hover { color: hsl(var(--foreground)); text-decoration: underline; }
</style>
</head>
<body>
<!-- ========== Navbar ========== -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand"><span class="logo"><svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg></span><span class="brand-text"><span>Storge</span><span class="brand-sub">File storage</span></span></div>
    <div class="nav-links">
      <button class="btn btn-ghost btn-icon" id="theme" title="Toggle theme"><svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    </div>
  </div>
</nav>

<div class="files-toolbar">
  <div class="card toolbar-card">
    <!-- ========== Breadcrumbs（反映当前所在文件夹） ========== -->
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <!-- 磁盘余量：仅展示与预估。服务端仍会在 init / chunk / merge 处强制校验 -->
    <div class="disk" id="disk" hidden>
      <div class="disk-bar" id="disk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="Disk usage"><div id="disk-fill"></div></div>
      <span class="disk-text" id="disk-text" aria-live="polite"></span>
    </div>
    <div class="files-head">
      <div class="head-actions">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file'), startBtn = $('start'), cancelBtn = $('cancel');
  const MAX_RETRY = 3;

  // 与 src/routers.rs `AUTH_TOKEN` 一致
  const AUTH_TOKEN = 'storge';
  async function api(url, opts = {}) {
    const headers = Object.assign({ Authorization: 'Bearer ' + AUTH_TOKEN }, opts.headers);
    return fetch(url, { ...opts, headers });
  }
  // ---------- 磁盘容量（GET /api/entries/disk） ----------
  // 职责：展示余量 + 上传前预估。真正的强制在服务端（init / chunk / merge → 507）：
  // 从看到数字到点按钮之间，磁盘可能被别的进程写满，所以这里只是少让人白传。
  let diskInfo = null;        // 最近一次成功采样；null = 接口不可用 → 隐藏组件
  let diskInflight = null;    // 同一时刻只允许一个在途请求
  let diskLastFetch = 0;
  const DISK_MIN_GAP_MS = 3000;   // 常规节流：多触发点（刷新/导航/弹窗）共用一次请求
  const DISK_POLL_MS = 5000;      // 轮询间隔（上传中才强制刷新）
  const DISK_WARN_RATIO = 0.2;    // 剩余 < 20% → warning
  const DISK_DANGER_RATIO = 0.05; // 剩余 < 5% → danger

  async function loadDisk(force = false) {
    const now = Date.now();
    if (!force && now - diskLastFetch < DISK_MIN_GAP_MS) return;
    if (diskInflight) return diskInflight;
    diskLastFetch = now;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 10000);
    diskInflight = (async () => {
      try {
        const res = await api('/api/entries/disk', { signal: ctrl.signal });
        const j = await res.json().catch(() => ({}));
        if (!res.ok || j.error) throw new Error(j.error || res.statusText);
        diskInfo = j;
      } catch {
        // 静默降级：对端不支持 / 超时 / 未鉴权时隐藏组件，绝不影响文件浏览与上传
        diskInfo = null;
      } finally {
        clearTimeout(to);
        diskInflight = null;
        renderDisk();
        renderDiskEst();
      }
    })();
    return diskInflight;
  }

  // merge / delete 响应直接回带 disk_available，省一次往返
  function applyDiskHint(j) {
    if (!j || j.disk_available == null || !diskInfo) return;
    diskInfo = { ...diskInfo, available: j.disk_available, stale: false };
    renderDisk();
    renderDiskEst();
  }

  function diskFreeRatio() {
    if (!diskInfo || !diskInfo.total) return null;
    return Math.min(1, Math.max(0, (diskInfo.free ?? 0) / diskInfo.total));
  }

  function diskLevel() {
    const r = diskFreeRatio();
    if (r === null) return '';
    if (r <= DISK_DANGER_RATIO || (diskInfo.available ?? 0) <= 0) return 'danger';
    if (r <= DISK_WARN_RATIO) return 'warn';
    return '';
  }

  function renderDisk() {
    const box = $('disk');
    if (!box) return;
    if (!diskInfo) { box.hidden = true; return; }
    const d = diskInfo;
    const free = d.free ?? 0, total = d.total ?? 0;
    const used = d.used ?? Math.max(0, total - free);
    const pct = total ? Math.min(100, Math.round(used / total * 100)) : 0;
    box.hidden = false;
    box.className = 'disk' + (diskLevel() ? ' ' + diskLevel() : '');
    $('disk-fill').style.width = pct + '%';
    const bar = $('disk-bar');
    bar.setAttribute('aria-valuenow', String(pct));
    bar.setAttribute('aria-valuetext', `${fmtSize(free)} free of ${fmtSize(total)}`);
    $('disk-text').textContent = `${fmtSize(free)} free · ${pct}% used`;
    box.title = [
      `Total ${fmtSize(total)} · used ${fmtSize(used)} (${pct}%) · free ${fmtSize(free)}`,
      `Can accept about ${fmtSize(d.available ?? 0)} (keeps ${fmtSize(d.min_free ?? 0)} free`
        + (d.quota ? `, volume quota ${fmtSize(d.quota)}` : '') + ')',
      (d.reserved ?? 0) > 0
        ? `${fmtSize(d.reserved)} declared by ${d.sessions} in-flight upload(s) but not written yet`
        : null,
      d.staging_same_volume === false && d.staging_free != null
        ? `Temp dir is on another volume: ${fmtSize(d.staging_free ?? 0)} free of ${fmtSize(d.staging_total ?? 0)}`
        : null,
      `Sampled ${fmtDateTime(d.sampled_at)}${d.stale ? ' (stale)' : ''}`,
    ].filter(Boolean).join('\n');
  }

  // 队列里还没传完的总字节
  function queueBytes() {
    return queue.reduce((n, s) => (s.status === 'done' ? n : n + s.file.size), 0);
  }

  // 服务端余量不够装下整个队列 → 禁用 Start
  function diskBlocked() {
    if (!diskInfo || diskInfo.available == null) return false;
    return queueBytes() > diskInfo.available;
  }

  function renderDiskEst() {
    const el = $('disk-est');
    if (!el) return;
    const need = queueBytes();
    if (!diskInfo || !need) { el.hidden = true; el.textContent = ''; el.className = 'disk-est'; return; }
    const avail = diskInfo.available ?? 0;
    el.hidden = false;
    if (need > avail) {
      el.className = 'disk-est danger';
      el.textContent = `Not enough disk space: ${fmtSize(need)} selected, server can accept about `
        + `${fmtSize(avail)} (short by ${fmtSize(need - avail)}). Free up space or upload in parts.`;
      return;
    }
    const left = avail - need;
    el.className = 'disk-est' + (left <= (diskInfo.min_free ?? 0) * 2 ? ' warn' : '');
    el.textContent = `Free ${fmtSize(diskInfo.free ?? 0)} · this upload ${fmtSize(need)}`
      + ` → about ${fmtSize(left)} left afterwards`;
  }

  // 服务端磁盘不足的两种报错（容量守卫 507 / 文件系统 ENOSPC）：重试无意义
  function isDiskFullErr(e) {
    const m = String((e && e.message) || '');
    return m.includes('insufficient disk space') || m.includes('no space left');
  }

  function filenameFromDisposition(cd, fallback) {
    if (!cd) return fallback;
    const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
    if (star) {
      try { return decodeURIComponent(star[1]); } catch { return star[1]; }
    }
    const quoted = /filename="([^"]+)"/i.exec(cd);
    return quoted ? quoted[1] : fallback;
  }
  async function downloadEntry(name, kind) {
    const rel = (curPath ? curPath + '/' : '') + name;
    const url = '/api/entries/download?path=' + encodeURIComponent(rel);
    const fallback = kind === 'dir' ? name + '.tar' : name;
    try {
      const res = await api(url);
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.error || res.statusText);
      }
      const filename = filenameFromDisposition(res.headers.get('Content-Disposition'), fallback);
      // File System Access：流式落盘，避免整文件进内存。
      // picker 成功后 body 已被消费，失败不能再走 blob；取消（AbortError）直接返回。
      if (window.showSaveFilePicker && res.body && !res.bodyUsed) {
        try {
          const handle = await showSaveFilePicker({ suggestedName: filename });
          await res.body.pipeTo(await handle.createWritable());
          return;
        } catch (e) {
          if (e.name === 'AbortError') return;
          if (res.bodyUsed) throw e;
        }
      }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) {
      alert(e.message);
    }
  }

  // ---------- Start Upload 按钮状态：默认 / 上传中（spinner） ----------
  const ICON_UPLOAD = '<svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>';
  const ICON_SPINNER = '<svg class="ic spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
  function setStartState(uploading) {
    uploadingBatch = uploading;
    startBtn.classList.toggle('loading', uploading);
    startBtn.innerHTML = (uploading ? ICON_SPINNER : ICON_UPLOAD) + `<span>${uploading ? 'Uploading…' : 'Start Upload'}</span>`;
    const hasWork = queue.some(s => s.status !== 'done');
    const blocked = !uploading && hasWork && diskBlocked();
    startBtn.disabled = uploading || !hasWork || blocked;
    startBtn.title = blocked
      ? 'Not enough free disk space on the server for this queue'
      : '';
    renderDiskEst();
  }

  // ---------- 多文件并行上传：队列 + 每文件独立会话 ----------
  const FILE_CONCURRENCY = 2;  // 同时上传的文件数
  const CHUNK_CONCURRENCY = 3; // 每个文件并行上传的分片数
  const MAX_FILE_SIZE = 16 * 1024 * 1024 * 1024 * 1024; // 16 TiB，与后端一致
  const MAX_CHUNKS = 1_000_000;
  let queue = [];              // 会话（session）数组，每项一个独立进度
  let gen = 0;                 // 批次代号：取消 / 重新开始时使旧的 pump 链失效
  let gT0 = 0, gTEnd = 0;      // 总计时（聚合速度展示）
  let uploadingBatch = false;  // 批次进行中：禁止重复点击 Start

  // ---------- 日志 ----------
  const LOG_MAX_LINES = 500; // 日志最多保留行数（防长时上传撑爆 DOM）
  function log(msg, cls = '') {
    if (!uploadDialog.classList.contains('open')) return;
    const el = $('log');
    $('log-wrap').style.display = 'block';
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = `[${t}] ${msg}`;
    el.appendChild(div);
    while (el.children.length > LOG_MAX_LINES) el.firstElementChild.remove();
    el.scrollTop = el.scrollHeight;
  }

  // 上传弹窗日志：Copy（复用 copyLogToClipboard）
  $('log-copy').onclick = () => copyLogToClipboard($('log'), $('log-copy'));

  // 复制指定日志块到剪贴板（非安全上下文降级为 execCommand），按钮短暂反馈
  async function copyLogToClipboard(logEl, btn) {
    const text = logEl.innerText;
    if (!text.trim()) return;
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch {}
      ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
    setTimeout(() => { btn.textContent = old; }, 1500);
  }

  // ---------- 简单字符串哈希 → uploadId ----------
  function hashId(str) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = (Math.imul(h2, 31) + c) >>> 0;
    }
    return (h1.toString(16) + h2.toString(16)).padStart(16, '0');
  }

  // ---------- 断点续传：localStorage 记录 fileKey → uploadId（每文件独立） ----------
  // 续传键包含目标目录：同一文件传到不同文件夹互不抢 uploadId
  const fileKeyOf = (f, dir) => `${dir || ''}|${f.name}|${f.size}|${f.lastModified}`;
  const lsKeyOf = (f, dir) => 'chunkUpload.' + hashId(fileKeyOf(f, dir));
  const saveChunkSize = (s, sz) =>
    localStorage.setItem(lsKeyOf(s.file, s.targetDir) + '.cs', String(sz));
  const loadChunkSize = s => {
    const v = parseInt(localStorage.getItem(lsKeyOf(s.file, s.targetDir) + '.cs'), 10);
    if (!(v >= AUTO_CHUNK_MIN && v <= AUTO_CHUNK_MAX)) return null;
    if (Math.ceil(s.file.size / v) > MAX_CHUNKS) return null;
    return v;
  };
  const clearChunkSize = s => localStorage.removeItem(lsKeyOf(s.file, s.targetDir) + '.cs');
  // 已上传字节的精确值：末片短于 chunkSize，不能按 done.size * chunkSize 估算
  const exactDoneBytes = (s, doneSet) => {
    let n = 0;
    for (const i of doneSet) n += Math.min(s.chunkSize, Math.max(0, s.file.size - i * s.chunkSize));
    return n;
  };

  // ---------- SHA-256 增量哈希（纯 JS，边上传边计算，不占额外内存） ----------
  const SHA256_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2,
  ];
  class Sha256 {
    constructor() {
      this.h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
        0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
      this.block = new Uint8Array(64);
      this.n = 0;          // 已缓冲字节数
      this.len = 0n;       // 累计字节数（BigInt，支持 >4GB）
    }
    _compress(b) {
      const w = new Uint32Array(64);
      for (let i = 0; i < 16; i++)
        w[i] = ((b[i*4] << 24) | (b[i*4+1] << 16) | (b[i*4+2] << 8) | b[i*4+3]) >>> 0;
      for (let i = 16; i < 64; i++) {
        const x = w[i-15], y = w[i-2];
        const s0 = (((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3)) >>> 0;
        const s1 = (((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10)) >>> 0;
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let [a, b2, c, d, e, f, g, h] = this.h;
      for (let i = 0; i < 64; i++) {
        const S1 = (((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7))) >>> 0;
        const ch = ((e & f) ^ (~e & g)) >>> 0;
        const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
        const S0 = (((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10))) >>> 0;
        const maj = ((a & b2) ^ (a & c) ^ (b2 & c)) >>> 0;
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b2; b2 = a; a = (t1 + t2) >>> 0;
      }
      const H = this.h;
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b2)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    update(data) {
      this.len += BigInt(data.byteLength);
      let off = 0;
      if (this.n > 0) {
        const take = Math.min(64 - this.n, data.byteLength);
        this.block.set(data.subarray(0, take), this.n);
        this.n += take; off = take;
        if (this.n === 64) { this._compress(this.block); this.n = 0; }
      }
      for (; off + 64 <= data.byteLength; off += 64) this._compress(data.subarray(off, off + 64));
      if (off < data.byteLength) {
        this.block.set(data.subarray(off), 0);
        this.n = data.byteLength - off;
      }
    }
    hex() {
      const bitLen = this.len * 8n;
      this.update(new Uint8Array([0x80]));
      while (this.n !== 56) this.update(new Uint8Array(1));
      const lenBuf = new Uint8Array(8);
      for (let i = 0; i < 8; i++)
        lenBuf[i] = Number((bitLen >> BigInt(8 * (7 - i))) & 0xffn);
      this.update(lenBuf);
      let out = '';
      for (const v of this.h) out += (v >>> 0).toString(16).padStart(8, '0');
      return out;
    }
  }

  // 分块计算文件 SHA-256（8MB 一块，每块让出主线程保持 UI 流畅）
  async function hashFile(f) {
    const h = new Sha256();
    const CS = 8 * 1024 * 1024;
    for (let off = 0; off < f.size; off += CS) {
      const buf = new Uint8Array(await f.slice(off, Math.min(off + CS, f.size)).arrayBuffer());
      h.update(buf);
      await new Promise(r => setTimeout(r));
    }
    return h.hex();
  }
  // ---------- 进度：总体 + 每文件独立 ----------
  // 注意：render 跑在 300ms 定时器里，一旦抛异常会静默中断后续所有刷新
  // （页面上会永久停在最后一次成功渲染的旧值），因此整体 try/catch 兑底
  function render() {
    try {
      _render();
    } catch { /* 忽略单次渲染异常，下个 tick 继续 */ }
  }
  function _render() {
    let tb = 0, db = 0, tc = 0, dc = 0, active = 0;
    for (const s of queue) {
      // 完成不变量：done 的文件一律按 100% / 全部 chunks 展示，
      // 防止迟到的 reSync / 计数器竞态让已完成文件的进度条回跳
      const fin = s.status === 'done';
      tb += s.file.size;
      db += fin ? s.file.size : s.doneBytes;
      tc += s.totalChunks;
      dc += fin ? s.totalChunks : s.doneChunks;
      if (s.status === 'uploading') active++;
      const p = fin ? 100
        : (s.file.size ? Math.min(100, s.doneBytes * 100 / s.file.size) : 0);
      if (s.elBar) s.elBar.style.width = p.toFixed(1) + '%';
    }
    const pct = tb ? Math.min(100, db * 100 / tb) : 0;
    $('bar').style.width = pct + '%';
    $('pct').textContent = pct.toFixed(1) + '%';
    $('chunks').textContent = `${dc}/${tc} chunks`;
    // 上传完成后冻结结束时间，避免速度持续变化
    const dt = gT0 ? ((gTEnd || Date.now()) - gT0) / 1000 : 0;
    const speed = gT0 ? db * 8 / 1e6 / (dt || 1) : 0; // Mbps
    $('speed').textContent = `${speed.toFixed(1)} Mbps`;
    $('fname').textContent = `${queue.length} file(s) in queue · ${active} uploading`;
    $('fmeta').textContent = queue.length
      ? `${fmtSize(tb)} total → ${curPath ? '/' + curPath : '/'}`
      : '';
  }
  const timer = setInterval(render, 300);

  // 重建待传分片列表（分片重切 / 断点续传后调用）
  function rebuildTodo(s, uploadedSet) {
    s.todo = [];
    for (let i = 0; i < s.totalChunks; i++) if (!uploadedSet.has(i)) s.todo.push(i);
    s.next = 0;
  }

  // 重新 init 同步服务端状态（重切 / 分片大小变化后），并刷新进度计数
  function reSync(s, ir) {
    if (s.status === 'done') return; // 已完成：禁止任何迟到响应覆写计数器
    s.totalChunks = ir.total_chunks;
    const done = new Set(ir.uploaded);
    rebuildTodo(s, done);
    s.doneChunks = done.size;
    s.doneBytes = exactDoneBytes(s, done);
    render();
  }

  // ---------- 自动分片：按实际速度调节，目标每片传输 ~AUTO_CHUNK_TARGET_S（每文件独立） ----------
  const AUTO_CHUNK_MIN = 256 * 1024;       // 后端限制下限 256KB
  const AUTO_CHUNK_MAX = 64 * 1024 * 1024; // 与后端 MAX_CHUNK_SIZE 一致
  const AUTO_CHUNK_INIT = 2 * 1024 * 1024; // 小文件初始 2MB，大文件见 autoChunkInit
  const AUTO_CHUNK_TARGET_S = 1.5;         // 目标分片传输耗时（秒）

  function autoChunkInit(fileSize) {
    const minForCount = Math.ceil(fileSize / MAX_CHUNKS);
    let init = AUTO_CHUNK_INIT;
    if (fileSize > 100 * 1024 * 1024 * 1024) init = 16 * 1024 * 1024;
    else if (fileSize > 10 * 1024 * 1024 * 1024) init = 8 * 1024 * 1024;
    return Math.min(AUTO_CHUNK_MAX, Math.max(AUTO_CHUNK_MIN, init, minForCount));
  }

  // 动态调整某文件会话的分片大小（服务端重新切片，返回仍有效的分片）
  async function resizeChunkSize(s, newSize) {
    if (s.status !== 'uploading' || s.autoTuning) return;
    newSize = newSize || s.chunkSize;
    if (newSize === s.chunkSize) return;
    s.autoTuning = true; // 必须在首个 await 之前置位，避免其它 worker 在重切期间取片
    s.autoLastAdjust = Date.now();
    const oldSize = s.chunkSize;
    log(`${s.file.name}: chunk ${fmtSize(s.chunkSize)} → ${fmtSize(newSize)}, waiting for in-flight chunks…`, 'info');
    try {
      while (s.inflight > 0) await new Promise(r => setTimeout(r, 50));
      if (s.status !== 'uploading' || s.abort) return;
      const ir = await callInit(s, newSize);
      if (s.status !== 'uploading' || s.abort) return;
      s.chunkSize = newSize; // init 成功后再改本地粒度，避免用新大小打旧 meta
      saveChunkSize(s, newSize);
      reSync(s, ir);
      log(`${s.file.name}: chunk size → ${fmtSize(newSize)}, ${s.doneChunks}/${s.totalChunks} chunks valid, ${s.todo.length} pending (was ${fmtSize(oldSize)})`, 'ok');
    } catch (e) {
      log(`${s.file.name}: resize failed: ${e.message}, keeping ${fmtSize(s.chunkSize)}`, 'err');
    } finally {
      s.autoTuning = false;
    }
  }

  // 按本分片传输耗时触发调节（节流 + 防并发重入）。
  async function autoAdjustChunkSize(s, durS, lenBytes) {
    if (s.status !== 'uploading' || s.abort || s.autoTuning) return;
    if (s.next >= s.todo.length) return; // 无后续分片时重切会打乱位图，导致 merge 失败
    if (durS < 0.15 || lenBytes === 0) return;
    const now = Date.now();
    if (now - s.autoLastAdjust < 2000) return;
    let target = Math.round(lenBytes * AUTO_CHUNK_TARGET_S / durS);
    const minForCount = Math.ceil(s.file.size / MAX_CHUNKS);
    target = Math.min(AUTO_CHUNK_MAX, Math.max(AUTO_CHUNK_MIN, minForCount, target));
    if (Math.abs(target - s.chunkSize) / s.chunkSize < 0.2) return;
    await resizeChunkSize(s, target);
  }

  // ---------- 单个分片上传（带重试，属于某文件会话） ----------
  async function uploadChunk(s, idx) {
    s.inflight++;
    const tStart = Date.now(); // 本分片传输计时（自动分片的速度采样）
    try {
      for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
        if (s.abort) throw new Error('cancelled');
        // 每次（重）试都用当前分片大小重新切片：期间可能发生了自动分片重切
        const start = idx * s.chunkSize;
        const blob = s.file.slice(start, Math.min(start + s.chunkSize, s.file.size));
        const buf = await blob.arrayBuffer();
        try {
          const r = await api(`/api/entries/upload/chunk?upload_id=${encodeURIComponent(s.uploadId)}&index=${idx}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: buf,
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(j.error || r.statusText);
          s.doneChunks++;
          s.doneBytes += buf.byteLength;
          render();
          const durS = (Date.now() - tStart) / 1000;
          // 仅在真正开始重切时替换 promise，避免 no-op 覆盖正在进行的 resize
          if (!s.autoTuning && s.next < s.todo.length) {
            const p = autoAdjustChunkSize(s, durS, buf.byteLength);
            if (s.autoTuning) s.autoTuningPromise = p.catch(() => {});
          }
          if (attempt > 1) {
            log(`${s.file.name}: chunk ${idx + 1} succeeded on retry`, 'ok');
          }
          return;
        } catch (e) {
          if (s.abort) throw e;
          if (String(e.message).includes('out of range')) {
            log(`${s.file.name}: chunk ${idx + 1} obsolete after re-chunk, skipping`, 'info');
            return;
          }
          // 磁盘满不是临时错误：重试只会反复弄脏 staging，直接抛出
          if (attempt === MAX_RETRY || isDiskFullErr(e)) throw e;
          log(`${s.file.name}: chunk ${idx + 1} failed: ${e.message}, retry ${attempt}/${MAX_RETRY}…`, 'err');
          await new Promise(r => setTimeout(r, 500 * attempt));
        }
      }
    } finally {
      s.inflight--;
    }
  }

    const ext = (name.split('.').pop() || '').toLowerCase();
    let key = 'file';
    for (const [k, exts] of Object.entries(FILE_ICON_MAP))
      if (exts.includes(ext)) { key = k; break; }
    const path = key === 'file' ? FILE_ICON_PATHS.file
      : key === 'text' ? FILE_ICON_PATHS['file-text']
      : key === 'code' ? FILE_ICON_PATHS['file-code']
      : key === 'sheet' ? FILE_ICON_PATHS['file-spreadsheet']
      : FILE_ICON_PATHS[key];
    return SVG_OPEN + path + '</svg>';
  }

  function makeSession(f) {
    return {
      file: f,
      targetDir: curPath,
      uploadId: null,
      chunkSize: autoChunkInit(f.size),
      totalChunks: 0,
      todo: [], next: 0, inflight: 0,
      doneChunks: 0, doneBytes: 0,
      status: 'queued', // queued | uploading | done | error
      abort: false,
      autoTuning: false,
      autoTuningPromise: Promise.resolve(),
      autoLastAdjust: 0,
      el: null, elBar: null, elState: null,
    };
  }

  function addFiles(fileList) {
    let added = 0;
    for (const f of [...fileList]) {
      if (!f || !f.size) continue;
      if (f.size > MAX_FILE_SIZE) {
        log(`skipped ${f.name}: file exceeds 16TiB limit`, 'err');
        continue;
      }
      if (f.name.startsWith('.') || f.name === '.' || f.name === '..'
          || /[\\/\0"]/.test(f.name) || f.name.endsWith('.') || f.name.endsWith(' ')
          || f.name.length > 255) {
        log(`skipped ${f.name}: invalid filename`, 'err');
        continue;
      }
      const s = makeSession(f);
      s.el = document.createElement('div');
      s.el.className = 'qitem';
      s.el.innerHTML = `
        <div class="qtop">
          <span class="qname">${esc(f.name)}</span>
          <button class="qcancel" title="Remove / cancel this file" aria-label="Cancel">${ICON_X}</button>
        </div>
        <div class="qmeta"><span>${fmtSize(f.size)}</span><span class="qstate">Queued</span></div>
        <div class="bar qbar"><div style="width:0%"></div></div>`;
      s.elBar = s.el.querySelector('.qbar > div');
      s.elState = s.el.querySelector('.qstate');
      s.el.querySelector('.qcancel').onclick = () => cancelItem(s);
      queue.push(s);
      qitems.appendChild(s.el);
      added++;
    }
    if (!added) return;
    $('drop-text').textContent = queue.length > 1
      ? `${queue.length} file(s) in queue`
      : queue[queue.length - 1].file.name;
    $('info').style.display = 'block';
    setStartState(uploadingBatch);
    $('badge').innerHTML = '';
    render();
  }

  function removeItem(s) {
    const i = queue.indexOf(s);
    if (i >= 0) queue.splice(i, 1);
    s.el.remove();
    setStartState(uploadingBatch);
    render();
  }

  // 单文件取消：上传中中断（进度已存，可续传）；queued / done / error 直接移出队列
  function cancelItem(s) {
    if (s.status === 'uploading') s.abort = true;
    else removeItem(s);
  }

  function cancelAll() {
    gen++; // 使进行中的 pump 链失效
    for (const s of queue) if (s.status === 'uploading') s.abort = true;
  }

  function finishFile(s, mr) {
    s.doneBytes = s.file.size;
    s.status = 'done';
    localStorage.removeItem(lsKeyOf(s.file, s.targetDir));
    clearChunkSize(s);
    applyDiskHint(mr); // merge 回带的余量：不开新请求就能修正预估
    refreshFiles();
    if (!s.el.isConnected) return; // 弹窗已关闭并清空队列
    s.el.classList.add('done');
    s.elState.textContent = mr.verified ? 'Done · Verified ✓' : 'Done ✓';
    render();
    log(`✅ ${s.file.name}: ${fmtSize(mr.file_size)} → ${mr.path}${mr.verified ? ' (sha256 verified)' : ''}`, 'ok');
  }

  // ---------- 单文件主流程（init → 分片 → merge） ----------
  async function runFile(s, myGen) {
    s.status = 'uploading'; s.abort = false;
    s.chunkSize = loadChunkSize(s) || autoChunkInit(s.file.size);
    s.autoTuning = false; s.autoLastAdjust = 0;
    s.autoTuningPromise = Promise.resolve();
    s.doneChunks = 0; s.doneBytes = 0; s.inflight = 0;
    s.el.classList.remove('err');
    s.elState.textContent = 'Uploading…';
    render();
    const shaPromise = hashFile(s.file).catch(e => {
      log(`⚠️ ${s.file.name}: hash failed: ${e.message}, integrity check will be skipped on merge`, 'err');
      return null;
    });
    try {
      const key = lsKeyOf(s.file, s.targetDir);
      s.uploadId = localStorage.getItem(key) || hashId(fileKeyOf(s.file, s.targetDir));
      localStorage.setItem(key, s.uploadId);
      let ir;
      try {
        ir = await callInit(s, s.chunkSize);
      } catch (e) {
        if (!String(e.message).includes('bound to another file')) throw e;
        ir = null;
      }

      if (!ir) {
        s.uploadId = hashId(fileKeyOf(s.file, s.targetDir) + '|' + Date.now());
        s.chunkSize = autoChunkInit(s.file.size);
        localStorage.setItem(key, s.uploadId);
        ir = await callInit(s, s.chunkSize);
      }
      if (s.abort) throw new Error('cancelled');

      // 目标路径已有同名文件：merge 成功即完成（verified=秒传；否则服务端已按唯一命名合并副本）。
      // 仅当 merge 拒绝（400 分片未齐）才继续走上传流程。
      if (ir.merged) {
        const sha = await shaPromise;
        if (sha) {
          try {
            const mr = await tryMerge(s, sha);
            finishFile(s, mr);
            return;
          } catch {
            log(`${s.file.name}: existing file differs, uploading as a new copy`, 'info');
          }
        }
      }

      saveChunkSize(s, s.chunkSize);
      reSync(s, ir);
      if (s.doneChunks) {
        s.elState.textContent = `Resuming (${s.doneChunks} cached)…`;
        log(`${s.file.name}: ${s.doneChunks}/${s.totalChunks} chunks cached, resuming`, 'info');
      } else {
        log(`${s.file.name}: initialized uploadId=${s.uploadId} (${s.totalChunks} chunks)`, 'info');
      }

      const workers = Math.min(CHUNK_CONCURRENCY, s.todo.length);
      if (workers > 0) {
        await Promise.all(Array.from({ length: workers }, () => worker(s, myGen)));
      }

      await s.autoTuningPromise;
      if (s.abort) throw new Error('cancelled');

      log(`${s.file.name}: all chunks uploaded, requesting merge…`, 'info');
      const sha = await shaPromise;
      const mr = await tryMerge(s, sha);
      finishFile(s, mr);
    } catch (e) {
      s.status = 'error';
      if (myGen !== gen) return; // 弹窗已关闭并清空队列
      s.el.classList.add('err');
      const cancelled = s.abort;
      const integrity = String(e.message).includes('integrity check failed');
      const diskFull = isDiskFullErr(e);
      s.elState.textContent = cancelled ? 'Cancelled'
        : diskFull ? 'Failed: server disk full'
        : `Failed: ${e.message}`;
      const hint = cancelled ? ''
        : diskFull ? ' (server disk is full / below its min-free reserve — free up space, then retry)'
        : integrity ? ' (hash mismatch, click "Start Upload" to re-upload)'
        : ' (progress saved, click "Start Upload" to resume)';
      log(`❌ ${s.file.name}: ${e.message}${hint}`, cancelled ? 'info' : 'err');
      if (diskFull) loadDisk(true); // 余量肯定变了，立刻重拉，并重新评估 Start 按钮
      render();
    }
  }

  async function worker(s, myGen) {
    while (true) {
      await s.autoTuningPromise; // 先等重切，避免 todo 已空时提前退出、与 merge 抢写锁
      if (s.abort || myGen !== gen) break;
      if (s.next >= s.todo.length) break;
      const idx = s.todo[s.next++];
      await uploadChunk(s, idx);
    }
  }

  // ---------- 主流程：启动队列中所有文件的并行上传 ----------
  async function startUpload() {
    const files = queue.filter(s => s.status !== 'done');
    if (!files.length || uploadingBatch) return;
    const dest = curPath;
    for (const s of files) s.targetDir = dest;
    gen++;
    const myGen = gen;
    gT0 = Date.now(); gTEnd = 0;
    setStartState(true);   // 按钮切换为「Uploading…」（spinner + 禁用）
    cancelBtn.disabled = false;
    $('badge').innerHTML = '';
    log(`Uploading ${files.length} file(s): ${FILE_CONCURRENCY} files in parallel × ${CHUNK_CONCURRENCY} chunks/file, auto chunking ${fmtSize(AUTO_CHUNK_MIN)}–${fmtSize(AUTO_CHUNK_MAX)}`, 'info');
    const pending = [...files];
    async function pump() {
      while (true) {
        if (myGen !== gen) return; // 已取消，终止本 pump 链
        const s = pending.shift();
        if (!s) return;
        await runFile(s, myGen);
      }
    }
    await Promise.all(Array.from(
      { length: Math.max(1, Math.min(FILE_CONCURRENCY, files.length)) }, pump));
    if (myGen !== gen) return; // 弹窗已关闭并清空队列
    gTEnd = Date.now(); // 冻结速度统计
    const ok = files.filter(s => s.status === 'done').length;
    if (ok === files.length && ok > 0) {
      $('badge').innerHTML = `<span class="badge">Done · ${ok} file(s)</span>`;
      log(`🎉 All ${ok} file(s) uploaded successfully`, 'ok');
    }
    setStartState(false); // 结束（完成 / 取消）→ 恢复「Start Upload」
    cancelBtn.disabled = true;
    render();
  }

  // ---------- 事件（多文件） ----------
  drop.onclick = () => fileInput.click();
  fileInput.onchange = e => {
    if (e.target.files && e.target.files.length) addFiles(e.target.files);
    e.target.value = '';
  };
  ['dragover', 'dragenter'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => {
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  startBtn.onclick = startUpload;
  cancelBtn.onclick = cancelAll;

  // ---------- 文件浏览器（GET /api/entries?path=，支持递归目录） ----------
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let curPath = ''; // 相对 files/ 的当前目录，'' = 根
  let lastEntries = [];

  // 面包屑：Home / a / b —— 每段可点击回跳
  function renderBreadcrumbs() {
    const bc = $('breadcrumbs');
    const parts = curPath ? curPath.split('/').filter(Boolean) : [];
    let html = '<button class="crumb crumb-home" data-path="" title="Home" aria-label="Home">'
      + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'
      + '</button>';
    parts.forEach((seg, i) => {
      const p = parts.slice(0, i + 1).join('/');
      const isLast = i === parts.length - 1;
      html += '<span class="crumb-sep">/</span>' + (isLast
        ? `<span class="crumb-current">${esc(seg)}</span>`
        : `<button class="crumb" data-path="${esc(p)}">${esc(seg)}</button>`);
    });
    bc.innerHTML = html;
    bc.querySelectorAll('.crumb').forEach(b =>
      b.onclick = () => navigateTo(b.dataset.path));
  }

  function navigateTo(path) {
    curPath = path || '';
    renderBreadcrumbs();
    updateUploadDest();
    refreshFiles();
  }

  async function refreshFiles() {
    const tbody = $('files-body');
    const empty = $('files-empty');
    tbody.innerHTML = '<tr><td colspan="8" class="empty">Loading…</td></tr>';
    empty.style.display = 'none';
    try {
      // 刷新列表顺带修正磁盘余量（内部有节流，不会每次都 statvfs）
      loadDisk(false);
      const url = '/api/entries' + (curPath ? `?path=${encodeURIComponent(curPath)}` : '');
      const res = await api(url);
      const list = await res.json().catch(() => ({}));
      if (!res.ok || list.error) throw new Error(list.error || res.statusText);
      lastEntries = Array.isArray(list) ? list : [];
      if (!list.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      tbody.innerHTML = list.map((f, i) => {
        const idx = `<td class="ctr idx">${i + 1}</td>`;
        if (f.kind === 'dir') {
          // 目录行：点击进入（URL 编码逐段处理）
          const sub = curPath ? curPath + '/' + f.name : f.name;
          return `<tr class="row-dir" data-path="${esc(sub)}">
            ${idx}
            <td class="fname"><svg class="ic dir-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>${esc(f.name)}</td>
            <td class="ctr"><span class="badge resume">Folder</span></td>
            <td class="num">—</td>
            <td class="num">${fmtDateTime(f.created)}</td>
            <td class="num">${fmtDateTime(f.modified)}</td>
            <td class="num">${fmtDateTime(f.accessed)}</td>
            <td class="act-cell"><button class="btn btn-ghost act" data-menu="dir" data-name="${esc(f.name)}" title="Actions" aria-haspopup="menu" aria-label="Actions">${ICON_MORE}</button></td>
          </tr>`;
        }
        return `<tr>
          ${idx}
          <td class="fname">${fileIcon(f.name)}${esc(f.name)}</td>
          <td class="ctr"><span class="badge">File</span></td>
          <td class="num">${fmtSize(f.size || 0)}</td>
          <td class="num">${fmtDateTime(f.created)}</td>
          <td class="num">${fmtDateTime(f.modified)}</td>
          <td class="num">${fmtDateTime(f.accessed)}</td>
          <td class="act-cell"><button class="btn btn-ghost act" data-menu="file" data-name="${esc(f.name)}" title="Actions" aria-haspopup="menu" aria-label="Actions">${ICON_MORE}</button></td>
        </tr>`;
      }).join('');
      // 绑定目录行点击
      tbody.querySelectorAll('.row-dir').forEach(tr =>
        tr.onclick = e => { if (!e.target.closest('[data-menu]')) navigateTo(tr.dataset.path); });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">Failed to load: ${esc(e.message)}</td></tr>`;
    }
  }
  $('refresh-files').onclick = refreshFiles;

  // Action 列：Dropdown Menu（⋯ 按钮展开 Download / Delete）
  $('files-body').addEventListener('click', e => {
    const btn = e.target.closest('[data-menu]');
    if (!btn) return;
    e.stopPropagation();
    const name = btn.dataset.name, kind = btn.dataset.menu;
    const items = [{
      label: 'Details', icon: ICON_INFO,
      onClick: () => openInfo(name, kind),
    }, {
      label: kind === 'dir' ? 'Download (.tar)' : 'Download', icon: ICON_DOWNLOAD,
      onClick: () => downloadEntry(name, kind),
    }];
    items.push(
      {
        label: 'Rename', icon: ICON_PENCIL,
        onClick: () => openRename(name, kind),
      },
      { separator: true },
      {
        label: 'Delete', icon: ICON_TRASH, danger: true,
        onClick: () => confirmDelete(name, kind),
      },
    );
    openMenu(btn, items);
  });

  // 删除：目录递归删除需二次确认
  function confirmDelete(name, kind) {
    const msg = kind === 'dir'
      ? `Delete folder "${name}" and ALL of its contents?`
      : `Delete file "${name}"?`;
    if (!confirm(msg)) return;
    api('/api/entries/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: curPath || undefined, name }),
    })
      .then(async r => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.error) throw new Error(j.error || r.statusText);
        applyDiskHint(j); // 删除释放的空间立刻反映到容量条
      })
      .then(() => refreshFiles())
      .catch(err => alert(err.message));
  }

  // 修改时间：固定宽度格式 YYYY/MM/DD HH:mm:ss（全部补零，列宽恒定）
  function fmtDateTime(secs) {
    if (!secs) return '—';
    const d = new Date(secs * 1000);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} `
      + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  // 重命名（当前目录内改名，Dialog 弹窗）
  const renameDialog = $('rename-dialog'), renameOverlay = $('rename-overlay');
  let renameTarget = null; // { name, kind }
  function openRename(name, kind) {
    renameTarget = { name, kind };
    $('rename-desc').textContent = `${kind === 'dir' ? 'Folder' : 'File'} in ${curPath ? '/' + curPath : '/'}`;
    const input = $('rename-name');
    input.value = name;
    renameOverlay.classList.add('open');
    renameDialog.classList.add('open');
    setTimeout(() => {
      input.focus();
      // 文件：默认选中主名（不含扩展名），方便直接改
      const dot = kind === 'file' ? name.lastIndexOf('.') : -1;
      if (dot > 0) input.setSelectionRange(0, dot);
    }, 100);
  }
  function closeRename() {
    renameTarget = null;
    renameOverlay.classList.remove('open');
    renameDialog.classList.remove('open');
  }
  async function submitRename() {
    const n = $('rename-name').value.trim();
    if (!n || !renameTarget) return;
    $('rename-submit').disabled = true;
    try {
      const r = await api('/api/entries/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: curPath || undefined, name: renameTarget.name, new_name: n }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(j.error || r.statusText);
      closeRename();
      refreshFiles();
    } catch (e) {
      alert(e.message);
    } finally {
      $('rename-submit').disabled = false;
    }
  }
  $('rename-close').onclick = closeRename;
  $('rename-cancel').onclick = closeRename;
  $('rename-submit').onclick = submitRename;
  renameOverlay.onclick = closeRename;
  $('rename-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitRename();
    if (e.key === 'Escape') closeRename();
  });

  // 详细信息（含 SHA-256）
  const infoDialog = $('info-dialog'), infoOverlay = $('info-overlay');
  let infoHash = '';
  let infoGen = 0;
  function kvRow(k, vHtml) {
    return `<div class="kv-k">${esc(k)}</div><div class="kv-v">${vHtml}</div>`;
  }
  function fillInfoKv(name, kind, rel, f, shaHtml) {
    const size = kind === 'dir' || f.size == null
      ? '—'
      : (typeof f.size === 'number' ? `${fmtSize(f.size)} (${Number(f.size).toLocaleString()} bytes)` : '—');
    $('info-kv').innerHTML =
      kvRow('Name', esc(name)) +
      kvRow('Type', kind === 'dir' ? 'Folder' : 'File') +
      kvRow('Path', esc('/' + rel)) +
      kvRow('Size', esc(size)) +
      kvRow('Created', esc(fmtDateTime(f.created))) +
      kvRow('Modified', esc(fmtDateTime(f.modified))) +
      kvRow('Accessed', esc(fmtDateTime(f.accessed))) +
      (kind === 'file' ? kvRow('SHA-256', shaHtml) : '');
  }
  function openInfo(name, kind) {
    infoHash = '';
    const gen = ++infoGen;
    const rel = (curPath ? curPath + '/' : '') + name;
    $('info-desc').textContent = `${kind === 'dir' ? 'Folder' : 'File'} in ${curPath ? '/' + curPath : '/'}`;
    const cached = lastEntries.find(x => x.name === name) || {};
    fillInfoKv(name, kind, rel, cached, '<span class="mono" id="info-sha">Loading…</span>');
    infoOverlay.classList.add('open');
    infoDialog.classList.add('open');
    api('/api/entries/info?path=' + encodeURIComponent(rel))
      .then(async r => {
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.error) throw new Error(j.error || r.statusText);
        return j;
      })
      .then(j => {
        if (gen !== infoGen || !infoDialog.classList.contains('open')) return;
        let shaHtml = '';
        if (j.kind === 'file') {
          infoHash = j.sha256 || '';
          shaHtml = infoHash
            ? `<div class="hash-row"><span class="mono" id="info-sha">${esc(infoHash)}</span><button type="button" class="btn btn-outline act" id="info-copy" title="Copy SHA-256">${ICON_COPY}Copy</button></div>`
            : '<span class="mono">—</span>';
        }
        fillInfoKv(j.name || name, j.kind || kind, j.path || rel, j, shaHtml);
        const copyBtn = $('info-copy');
        if (copyBtn) copyBtn.onclick = copyInfoHash;
      })
      .catch(e => {
        if (gen !== infoGen) return;
        const el = $('info-sha');
        if (el) el.textContent = e.message;
      });
  }
  function closeInfo() {
    infoGen++;
    infoHash = '';
    infoOverlay.classList.remove('open');
    infoDialog.classList.remove('open');
  }
  async function copyInfoHash() {
    if (!infoHash) return;
    try {
      await navigator.clipboard.writeText(infoHash);
      const btn = $('info-copy');
      if (btn) { btn.lastChild.textContent = 'Copied'; setTimeout(() => { if (btn.isConnected) btn.lastChild.textContent = 'Copy'; }, 1200); }
    } catch (_) {
      alert(infoHash);
    }
  }
  $('info-close').onclick = closeInfo;
  infoOverlay.onclick = closeInfo;

  // 新建文件夹（当前目录，Dialog 弹窗）
  const mkdirDialog = $('mkdir-dialog'), mkdirOverlay = $('mkdir-overlay');
  function openMkdir() {
    $('mkdir-desc').textContent = `Creates in ${curPath ? '/' + curPath : '/'}`;
    $('mkdir-name').value = '';
    mkdirOverlay.classList.add('open');
    mkdirDialog.classList.add('open');
    setTimeout(() => $('mkdir-name').focus(), 100);
  }
  function closeMkdir() {
    mkdirOverlay.classList.remove('open');
    mkdirDialog.classList.remove('open');
  }
  async function submitMkdir() {
    const n = $('mkdir-name').value.trim();
    if (!n) return;
    $('mkdir-submit').disabled = true;
    try {
      const r = await api('/api/entries/mkdir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: curPath || undefined, name: n }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(j.error || r.statusText);
      closeMkdir();
      refreshFiles();
    } catch (e) {
      alert(e.message);
    } finally {
      $('mkdir-submit').disabled = false;
    }
  }
  $('new-folder').onclick = openMkdir;
  $('mkdir-close').onclick = closeMkdir;
  $('mkdir-cancel').onclick = closeMkdir;
  $('mkdir-submit').onclick = submitMkdir;
  mkdirOverlay.onclick = closeMkdir;
  $('mkdir-name').addEventListener('keydown', e => { if (e.key === 'Enter') submitMkdir(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (infoDialog.classList.contains('open')) { closeInfo(); return; }
    if (mkdirDialog.classList.contains('open')) closeMkdir();
  });

  // 初始化：根目录
  renderBreadcrumbs();
  updateUploadDest();
  refreshFiles();

  // 磁盘容量：首屏拉一次；上传进行中每隔 DISK_POLL_MS 强制刷新（内部会跳过隐藏页）
  loadDisk(true);
  setInterval(() => { if (!document.hidden) loadDisk(uploadingBatch); }, DISK_POLL_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadDisk(false);
  });

  // shadcn-style theme toggle（默认跟随系统，手动切换后记忆）
  const themeBtn = $('theme');
  const ICON_SUN = '<svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
  const ICON_MOON = '<svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeBtn.innerHTML = dark ? ICON_SUN : ICON_MOON;
  }
  applyTheme(localStorage.getItem('theme')
    ? localStorage.getItem('theme') === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches);
  themeBtn.onclick = () => {
    const dark = !document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    applyTheme(dark);
  };

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
    if (b < 1099511627776) return (b / 1073741824).toFixed(2) + ' GB';
    return (b / 1099511627776).toFixed(2) + ' TB';
  }
})();
</script>
</body>
</html>
