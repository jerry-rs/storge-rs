<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" fill="none">
  <!-- 256×256 内在尺寸（高分辨率栅格化），viewBox 仍为 32 便于按网格对齐 -->
  <!-- Light background matching shadcn UI -->
  <rect width="32" height="32" rx="8" fill="#ffffff"/>

  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 图形相对上一版以画面中心放大 1.4x：占画布由 53% 提升到 75%（边距 4/32） -->
  <!-- Outer rounded frame - more circular feel -->
  <rect x="4.1" y="4.1" width="23.8" height="23.8" rx="7.7"
        stroke="#0f172a"
        stroke-width="2.2"
        fill="none"/>

  <!-- Four short unconnected diagonal segments (cross style, no contact) -->
  <!-- Top-left -->
  <path d="M8.3 8.3 L12.08 12.08"
        stroke="#0f172a"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Top-right -->
  <path d="M23.7 8.3 L19.92 12.08"
        stroke="#0f172a"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Bottom-left -->
  <path d="M8.3 23.7 L12.08 19.92"
        stroke="#0f172a"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Bottom-right -->
  <path d="M23.7 23.7 L19.92 19.92"
        stroke="#0f172a"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Soft center circle -->
  <circle cx="16" cy="16" r="3.92"
          stroke="#0f172a"
          stroke-width="2.1"
          fill="none"/>
</svg>
